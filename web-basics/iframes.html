


 <!DOCTYPE html>
<html lang="en">
<head>
</head>

<body>

    <!--
    Embed another websites content within your website

    Attributes
    src - link to the resource online
    width, height - size of window (pixels)
    title - people with screen readers etc
    allow full screen - let the user go to full screen
    -->

    <iframe
        width="560"
        height="315"
        src="https.//www.youtube.com/embed/8Fiuw71y1Q"
        title="Refelections (FULL VIDEO) - The Neighbourhood (NBHD)"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
    </iframe>

</body>
</html>
