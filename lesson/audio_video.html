<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module03: Audio Video</title>
</head>

<body>

    <!-- controls - Allow user to play, pause, etc -->

    <h2>Listen in</h2>

    <!-- Audio -->
    <audio src="./Assets/Images/reflections.mp3" controls>
        Your browser does not support the audio element.
    </audio>

    <br><br>

    <!-- Video (local mp4 if you have it) -->
    <video src="./Assets/Images/reflections.mp4" height="480" width="640" controls>
    
    </video>

</body>
</html>
